name: Sync Repository Labels

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - .github/labels.json
      - .github/workflows/labels.yml

permissions:
  contents: read
  issues: write

jobs:
  sync_labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const labels = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              ...context.repo,
              per_page: 100,
            });
            for (const label of labels) {
              if (existing.some(item => item.name === label.name)) {
                await github.rest.issues.updateLabel({ ...context.repo, ...label });
              } else {
                await github.rest.issues.createLabel({ ...context.repo, ...label });
              }
            }
