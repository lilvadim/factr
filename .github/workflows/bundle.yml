name: Package Distribution Artifacts

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create draft release with notes
        type: boolean
        default: false
      build_macos_arm64:
        description: Build macOS ARM64 DMG
        type: boolean
        default: true
      build_macos_intel:
        description: Build macOS Intel DMG
        type: boolean
        default: true
      build_windows_amd64:
        description: Build Windows AMD64 installer
        type: boolean
        default: true
      build_windows_arm64:
        description: Build Windows ARM64 installer
        type: boolean
        default: true
      build_linux_amd64:
        description: Build Linux AMD64 DEB, RPM and Arch
        type: boolean
        default: true
      build_linux_arm64:
        description: Build Linux ARM64 DEB, RPM and Arch
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  select_platforms:
    name: Select Platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      enabled: ${{ steps.select.outputs.enabled }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Read Package Version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\ntag=v{version}\n")
          PY
      - uses: actions/github-script@v7
        id: select
        env:
          BUILD_INPUTS: ${{ toJSON(inputs) }}
        with:
          script: |
            const inputs = JSON.parse(process.env.BUILD_INPUTS);
            const platforms = [
              { input: 'build_macos_arm64', platform: 'macos-arm64', runner: 'macos-15', format: 'dmg', path: 'target/release/*.dmg' },
              { input: 'build_macos_intel', platform: 'macos-amd64', runner: 'macos-15', format: 'dmg', target: 'x86_64-apple-darwin', path: 'target/x86_64-apple-darwin/release/*.dmg' },
              { input: 'build_windows_amd64', platform: 'windows-amd64', runner: 'windows-2022', format: 'nsis', path: 'target/release/*setup.exe' },
              { input: 'build_windows_arm64', platform: 'windows-arm64', runner: 'windows-11-arm', format: 'nsis', target: 'aarch64-pc-windows-msvc', path: 'target/aarch64-pc-windows-msvc/release/*setup.exe' },
              { input: 'build_linux_amd64', platform: 'linux-amd64', runner: 'ubuntu-22.04', format: 'deb,rpm,archlinux', arch: 'amd64', path: 'target/packages/*' },
              { input: 'build_linux_arm64', platform: 'linux-arm64', runner: 'ubuntu-22.04-arm', format: 'deb,rpm,archlinux', arch: 'arm64', path: 'target/packages/*' },
            ];
            const include = platforms.filter(platform => inputs[platform.input]);
            if (inputs.create_release && include.length === 0) {
              core.setFailed('Select at least one platform to create a release.');
              return;
            }
            core.setOutput('matrix', JSON.stringify({ include }));
            core.setOutput('enabled', include.length > 0);

  package_app:
    name: ${{ matrix.platform }}
    needs: select_platforms
    if: needs.select_platforms.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select_platforms.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup update stable --no-self-update
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev libudev-dev libssl-dev pkg-config
      - name: Install Packager
        if: runner.os != 'Linux'
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Install Linux Packager
        if: runner.os == 'Linux'
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v2.49.0/nfpm_2.49.0_Linux_${PACKAGE_ARCH}.tar.gz" -o "$RUNNER_TEMP/nfpm.tar.gz"
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install Rust Target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: Package Release
        if: runner.os != 'Linux' && matrix.target == ''
        run: cargo packager --release --formats ${{ matrix.format }}
      - name: Package Targeted Release
        if: matrix.target != ''
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.format }}
      - name: Package Linux Release
        if: runner.os == 'Linux'
        run: ./packaging/linux/package.sh
      - name: Name Package
        uses: actions/github-script@v7
        env:
          PACKAGE_PATH: ${{ matrix.path }}
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_FORMAT: ${{ matrix.format }}
          PACKAGE_VERSION: ${{ needs.select_platforms.outputs.version }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const directory = path.dirname(process.env.PACKAGE_PATH);
            const outputDirectory = 'target/packages-pipeline-tmp';
            fs.mkdirSync(outputDirectory, { recursive: true });
            for (const format of process.env.PACKAGE_FORMAT.split(',')) {
              const extension = format === 'archlinux' ? '.pkg.tar.zst' : format === 'nsis' ? '.exe' : `.${format}`;
              const suffix = format === 'nsis' ? `-setup${extension}` : extension;
              const files = fs.readdirSync(directory).filter(name => name.endsWith(suffix));
              if (files.length !== 1) {
                throw new Error(`Expected one ${format} package in ${directory}, found ${files.length}`);
              }
              const installer = format === 'nsis' ? '-setup' : '';
              const filename = `Factr_${process.env.PACKAGE_VERSION}_${process.env.PACKAGE_PLATFORM}${installer}${extension}`;
              fs.copyFileSync(path.join(directory, files[0]), path.join(outputDirectory, filename));
            }
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Factr_${{ matrix.platform }}
          path: target/packages-pipeline-tmp/*
          if-no-files-found: error

  create_release:
    name: Create Draft Release
    needs: [select_platforms, package_app]
    if: inputs.create_release && needs.package_app.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-${{ needs.select_platforms.outputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.select_platforms.outputs.tag }}
      RELEASE_VERSION: ${{ needs.select_platforms.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate Release Tag
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG points to a different commit."
              exit 1
            fi
          fi
      - name: Download Packages
        uses: actions/download-artifact@v4
        with:
          pattern: Factr_*
          path: release-assets
          merge-multiple: true
      - name: Generate Checksums
        working-directory: release-assets
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
      - name: Create Draft Release
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "Factr $RELEASE_VERSION" \
            --draft \
            --generate-notes
