[package]
name = "factr-auth"
version = "1.0.0"
edition = "2024"

[package.metadata.bundle]
name = "Factr"
identifier = "factr-auth"
icon = ["assets/icon/factr_icon.png"]

[dependencies]
egui = { version = "0.33.2", features = ["default", "persistence"] }
egui_extras = { version = "0.33.2", features = ["default"] }
eframe = { version = "0.33.2", features = ["default", "wgpu", "persistence"] }

rust-i18n = "3.1.4"
env_logger = { version = "0.10", features = ["auto-color", "humantime"] }

chrono = "0.4.41"
rand = "0.9.0"

totp-rs = { version = "5.7.0", features = [
  "gen_secret",
  "serde_support",
  "otpauth","steam"
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
aes-gcm = "0.10.3"
uuid = { version = "1.23.3", features = ["serde","v4"] }
qrcode = "0.14.1"
rqrr = "0.10.1"
argon2 = "0.5.3"
zeroize = "1.9.0"
base64 = "0.22.1"
image = "0.25.10"
