[package]
name = "factr-auth"
version = "2.0.0"
edition = "2024"
description = "TOTP authenticator app"
repository = "https://github.com/lilvadim/factr"

[workspace]
members = ["crates/core", "crates/storage", "crates/system-protection"]
default-members = ["."]
resolver = "3"

[workspace.dependencies]
factr-core = { path = "crates/core" }
factr-storage = { path = "crates/storage" }
factr-system-protection = { path = "crates/system-protection" }
base64 = "0.23.1"
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
totp-rs = { version = "6.0.0", features = ["gen_secret", "serde", "otpauth", "zeroize"] }
uuid = { version = "1.29.2", features = ["serde", "v4"] }
zeroize = "1.9.1"

[package.metadata.packager]
product-name = "Factr"
identifier = "factr-auth"
icons = ["assets/icon/factr_icon.png"]
category = "Utility"
description = "Two-factor authenticator"
long-description = """
Generate time-based one-time passwords (TOTP) for your accounts.
Secrets are stored locally in a password-protected encrypted vault.
"""
homepage = "https://github.com/lilvadim/factr"
before-packaging-command = "cargo build --release"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
signing-identity = "-"

[package.metadata.packager.appimage]
libs = ["libxkbcommon.so.0"]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
languages = ["English", "Russian"]
installer-icon = "assets/icon/factr_icon.ico"

[build-dependencies]
winresource = "0.1.34"

[dependencies]
factr-core.workspace = true
factr-storage.workspace = true
factr-system-protection.workspace = true
egui = { version = "0.37.0", features = ["default", "persistence"] }
egui_extras = { version = "0.37.0", features = ["default"] }
eframe = { version = "0.37.0", features = ["default", "wgpu", "persistence"] }

rust-i18n = "4.2.4"
env_logger = { version = "0.11.11", features = ["auto-color", "humantime"] }

chrono.workspace = true
totp-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
qrcode = "0.14.1"
rqrr = "0.11.0"
zeroize.workspace = true
image = "0.25.10"
