  unlock-system: Unlock with system authentication
  system-reason: Unlock your Factr vault
  linux-security-warning-title: Linux Security Warning
  linux-security-warning: Due to the way Secret Service (GNOME Keyring, KWallet) stores the key, other apps running as your user may access your vault without asking for your password or fingerprint.
