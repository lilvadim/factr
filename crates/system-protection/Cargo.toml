[package]
name = "factr-system-protection"
version = "0.1.0"
edition = "2024"
publish = false
links = "factr_system_protection"

[dependencies]
factr-core.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
serde_json.workspace = true
secret-service = { version = "5.2", features = ["rt-async-io-crypto-rust"] }
zbus = "5.19"

[build-dependencies]
cc = "1"
